name: animated_splash_themes
description: >-
  Richly animated Flutter splash screens with 5 built-in styles: Particles, Neon,
  Grid, Bounce, and Expand (X-style logo zoom). Supports random style selection,
  custom colors, and configurable display duration.
version: 1.1.2
repository: https://github.com/piro-hiroki/animated_splash_themes
issue_tracker: https://github.com/piro-hiroki/animated_splash_themes/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
